name: Boj get Update

on:
  workflow_dispatch:
  schedule:
    # 01:00 UTC = 10:00 JST (Mon–Fri)
    - cron: '0 1 * * 1-5'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run scripts (sequential, continue on error)
        run: |
          set +e

          echo "=== get_bojapi_kigyobukka.js ==="
          xvfb-run -a node get_nikkei225.js || echo "FAILED: bojapi_kigyobukka.js"

          echo "=== get_bojapi_monetorybase.js ==="
          xvfb-run -a node get_jpx.js || echo "FAILED: bojapi_monetorybase.js"

      - name: Save results
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add data/*.csv
          git commit -m "Automated update" || exit 0
          git push
